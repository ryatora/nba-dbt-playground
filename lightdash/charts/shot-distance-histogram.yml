    eChartsConfig:
      axisLabelFontSize: 12
      axisTitleFontSize: 16
      series:
        - encode:
            xRef:
              field: shot_distance_bin
            yRef:
              field: shots_shot_count
          type: bar
      xAxis:
        - name: シュートの距離（フィート）
      yAxis:
        - name: シュート本数
    layout:
      showIncompletePeriod: true
      xField: shot_distance_bin
      yField:
        - shots_shot_count
  type: cartesian
contentType: chart
description: 2025-26 シーズンのレギュラーシーズンで、フィールドゴールの試投を、ゴールからの距離で 3 フィートごとに数える。39 フィート以上はまとめる。
metricQuery:
  additionalMetrics: []
  customDimensions:
