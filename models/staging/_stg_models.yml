models:
  - name: stg_games
    description: >
      試合の一覧。粒度: 1 試合 1 行（game_id）。
      {{ doc("start_season_year_filter") }}
    columns:
      - name: game_id
        description: '{{ doc("game_id") }}'
        data_tests:
          - unique
          - not_null
      - name: season_start_year
        description: '{{ doc("season_start_year") }}'
      - name: season
        description: '{{ doc("season") }}'
        data_tests:
          - not_null
      - name: game_type
        description: '{{ doc("game_type") }}'
        data_tests: &game_type_tests
          - not_null
          - accepted_values:
              arguments:
                values: [Preseason, Regular Season, All-Star, Playoffs, Play-In, NBA Cup Final]
      - name: game_label
        description: >
          試合の区分の表示名（例: NBA Finals、East First Round）。プレーオフや特別な試合だけに入っている。
          表記揺れがあるため、集計には game_type を使う。
      - name: game_sub_label
        description: "game_label の補足（例: Game 5）。"
      - name: game_started_at_est
        description: 試合開始日時（米国東部時間）。
      - name: game_date
        description: '{{ doc("game_date") }}'
        data_tests:
          - not_null
      - name: home_team_id
        description: ホームチームの team_id。
        data_tests:
          - not_null
      - name: home_team_city
        description: ホームチームの都市名。オールスターの一部の試合は null。
      - name: home_team_name
        description: ホームチームのチーム名（都市名を除いた部分）。
      - name: away_team_id
        description: アウェイチームの team_id。
        data_tests:
          - not_null
      - name: away_team_city
        description: アウェイチームの都市名。オールスターの一部の試合は null。
      - name: away_team_name
        description: アウェイチームのチーム名（都市名を除いた部分）。
      - name: home_score
        description: ホームチームの得点。
        data_tests:
          - not_null
      - name: away_score
        description: アウェイチームの得点。
        data_tests:
          - not_null
      - name: winner_team_id
        description: >
          勝ったチームの team_id。home_team_id か away_team_id のどちらか
          （tests/assert_winner_is_home_or_away.sql で確かめる）。
        data_tests:
          - not_null
      - name: attendance
        description: 観客数。2025-26 シーズンの試合だけに入っていて、その中にも null の試合がある。
      - name: arena_id
        description: 会場の ID。全試合に入っているが、2005-06 シーズンの 1 試合は 0。
      - name: arena_name
        description: 会場の名前。2025-26 シーズンの試合だけに入っている。
      - name: arena_city
        description: 会場の都市名。2025-26 シーズンの試合だけに入っている。
      - name: arena_state
        description: "会場の州の略称（例: CA）。2025-26 シーズンの試合だけに入っていて、その中にも null の試合がある。"

  - name: stg_players
    description: >
      選手の一覧。粒度: 1 選手 1 行（player_id）。シーズンでは絞らない。
      生年月日・身長・体重・ドラフトなどの経歴は、一部の選手で null。
    columns:
      - name: player_id
        description: '{{ doc("player_id") }}'
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: 名。
      - name: last_name
        description: 姓。
      - name: player_name
        description: first_name と last_name をスペースでつないだもの。
      - name: birth_date
        description: 生年月日。
      - name: school
        description: "出身の大学や高校などの所属先（例: Kentucky）。"
      - name: country
        description: "出身国（例: USA）。"
      - name: height_inches
        description: 身長（インチ）。height_cm はこれを cm に換算したもの。
      - name: height_cm
        description: 身長（cm）。height_inches を換算し、小数第 1 位で丸めたもの。
      - name: weight_lbs
        description: 体重（ポンド）。weight_kg はこれを kg に換算したもの。
      - name: weight_kg
        description: 体重（kg）。weight_lbs を換算し、小数第 1 位で丸めたもの。
      - name: is_guard
        description: ガードとして登録されているか。is_forward・is_center と同時に true になることがあり、どれも false の選手もいる。
      - name: is_forward
        description: フォワードとして登録されているか。is_guard と同じく、他のポジションと同時に true になることがある。
      - name: is_center
        description: センターとして登録されているか。is_guard と同じく、他のポジションと同時に true になることがある。
      - name: draft_year
        description: ドラフトされた年。ドラフト外の選手は -1、経歴が入っていない選手は null。
      - name: draft_round
        description: >
          ドラフトの巡目。ドラフト外の選手は -1。経歴が入っていない選手と、
          ドラフトされた年はあるが巡目が入っていない一部の選手は null。
      - name: draft_number
        description: >
          ドラフトの指名順位。ドラフト外の選手は -1。経歴が入っていない選手と、
          ドラフトされた年はあるが指名順位が入っていない一部の選手は null。
      - name: first_season_start_year
        description: 最初に在籍したシーズンの開始年。経歴が入っていない選手は null。
      - name: last_season_start_year
        description: 最後に在籍したシーズンの開始年。現役の選手や、経歴が入っていない選手は null のことがある。

  - name: stg_team_histories
    description: >
      チームの移転・改名の履歴。粒度: 1 チームの 1 つの名称の期間につき 1 行（同じ team_id に複数行ある）。
      NBA・BAA に属したことのないチーム（EuroLeague など）も含むが、これらは試合のデータには出てこない。
      シーズンでは絞らない。
    data_tests:
      - unique_combination:
          arguments:
            columns: [team_id, first_season_start_year]
    columns:
      - name: team_id
        description: '{{ doc("team_id") }}'
        data_tests:
          - not_null
      - name: team_city
        description: '{{ doc("team_city") }}'
      - name: team_name
        description: '{{ doc("team_name") }}'
      - name: team_abbreviation
        description: "チームの略称（例: PHI）。"
      - name: league
        description: "所属リーグ（例: NBA、BAA、EuroLeague）。"
      - name: first_season_start_year
        description: この名称を使い始めたシーズンの開始年。
      - name: last_season_start_year
        description: この名称を最後に使ったシーズンの開始年。現在の名称は null。
      - name: is_current
        description: 現在の名称か。

  - name: stg_team_game_stats
    description: >
      チームの試合ごとのボックススコア。粒度: 1 試合 × 1 チームにつき 1 行（game_id × team_id）。
      クォーターごとの得点・ベンチの得点などの詳細な列は、プレシーズンの大半の試合と一部の試合で null。
      {{ doc("start_season_year_filter") }}
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, team_id]
      # int_player_game_stats の照合に使うキー。一意でないと、照合で行が増える
      - unique_combination:
          arguments:
            columns: [game_id, team_city, team_name]
    columns:
      - name: game_id
        description: '{{ doc("game_id") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: game_id
      - name: team_id
        description: '{{ doc("team_id") }}'
        data_tests:
          - not_null
      - name: season_start_year
        description: '{{ doc("season_start_year") }}'
      - name: season
        description: '{{ doc("season") }}'
        data_tests:
          - not_null
      - name: game_type
        description: '{{ doc("game_type") }}'
        data_tests: *game_type_tests
      - name: game_date
        description: '{{ doc("game_date") }}'
      - name: team_city
        description: >
          {{ doc("team_city") }}
          オールスターの試合と、2025-26 シーズンの一部の試合にある余分な行（得点が 0 の行）は null。
      - name: team_name
        description: >
          {{ doc("team_name") }}
          現在の 30 チームは seeds の nba_arenas.team_name と結合できる（relationships テストで確かめる）。
          2025-26 シーズンの一部の試合にある余分な行（得点が 0 の行）は null。
      - name: opponent_team_id
        description: 対戦相手のチームの team_id。
        data_tests:
          - not_null
      - name: opponent_team_city
        description: '{{ doc("opponent_team_city") }}'
      - name: opponent_team_name
        description: '{{ doc("opponent_team_name") }}'
      - name: is_home
        description: '{{ doc("is_home") }}'
      - name: is_win
        description: >
          {{ doc("is_win") }}
          元データの誤りで、得点が同じ（0-0 を含む）なのに勝敗が付いている試合がごく一部にある。
          2025-26 シーズンの一部の試合にある余分な行（得点が 0 の行）は null。
      - name: points
        description: チームの得点。
        data_tests:
          - not_null
      - name: opponent_points
        description: 対戦相手の得点。
        data_tests:
          - not_null
      - name: field_goals_made
        description: '{{ doc("field_goals_made") }}'
      - name: field_goals_attempted
        description: '{{ doc("field_goals_attempted") }}'
      - name: three_pointers_made
        description: '{{ doc("three_pointers_made") }}'
      - name: three_pointers_attempted
        description: '{{ doc("three_pointers_attempted") }}'
      - name: free_throws_made
        description: '{{ doc("free_throws_made") }}'
      - name: free_throws_attempted
        description: '{{ doc("free_throws_attempted") }}'
      - name: offensive_rebounds
        description: '{{ doc("offensive_rebounds") }}'
      - name: defensive_rebounds
        description: '{{ doc("defensive_rebounds") }}'
      - name: total_rebounds
        description: '{{ doc("total_rebounds") }}'
      - name: assists
        description: '{{ doc("assists") }}'
      - name: steals
        description: '{{ doc("steals") }}'
      - name: blocks
        description: '{{ doc("blocks") }}'
      - name: turnovers
        description: '{{ doc("turnovers") }}'
      - name: personal_fouls
        description: '{{ doc("personal_fouls") }}'
      - name: plus_minus
        description: '{{ doc("plus_minus") }}'
      - name: minutes
        description: >
          チームの選手の出場時間の合計（分）。延長がなければ 240（5 人 × 48 分）。
          オールスターの試合と、プレシーズンの一部の試合は 240 未満。
      - name: q1_points
        description: 第 1 クォーターの得点。
      - name: q2_points
        description: 第 2 クォーターの得点。
      - name: q3_points
        description: 第 3 クォーターの得点。
      - name: q4_points
        description: 第 4 クォーターの得点。
      - name: overtime_points
        description: 延長の得点の合計。延長がない試合はほとんどが null。
      - name: bench_points
        description: ベンチから出場した選手の得点の合計。
      - name: points_in_the_paint
        description: ペイントエリア（ゴール下の制限区域）での得点。
      - name: fast_break_points
        description: 速攻での得点。
      - name: second_chance_points
        description: オフェンスリバウンドの後の攻撃での得点（セカンドチャンスポイント）。
      - name: points_off_turnovers
        description: 相手のターンオーバーの後の攻撃での得点。
      - name: biggest_lead
        description: 試合中の最大のリード（点差）。
      - name: lead_changes
        description: 試合中にリードしているチームが入れ替わった回数。
      - name: times_tied
        description: 試合中に同点になった回数。
      - name: season_wins
        description: この試合を終えた時点での、シーズンの通算勝利数。
      - name: season_losses
        description: この試合を終えた時点での、シーズンの通算敗戦数。
      - name: playoff_seed
        description: プレーオフ・プレーインのシード順位。それ以外の試合はほとんどが null。

  - name: stg_player_game_stats
    description: >
      選手の試合ごとのボックススコア。粒度: 1 試合 × 1 選手につき 1 行（game_id × player_id）。
      ベンチ入りして出場しなかった試合の行も含む。元データに混ざっているチーム合計の行（personId が null）は除く。
      {{ doc("start_season_year_filter") }}
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, player_id]
    columns:
      - name: game_id
        description: >
          {{ doc("game_id") }}
          {{ doc("game_id_not_in_games") }}
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: game_id
              # 元データの欠けで stg_games にない試合があるため、失敗ではなく警告にする
              config:
                severity: warn
      - name: player_id
        description: '{{ doc("player_id") }}'
        data_tests:
          - not_null
      - name: season_start_year
        description: '{{ doc("season_start_year") }}'
      - name: season
        description: '{{ doc("season") }}'
        data_tests:
          - not_null
      - name: game_type
        description: '{{ doc("game_type") }}'
        data_tests: *game_type_tests
      - name: game_date
        description: >
          {{ doc("game_date") }}
          一部のプレシーズンの行は null。
      - name: player_name
        description: >
          元データの名と姓をスペースでつないだもの。元データで名前が空の行（一部のプレシーズン・オールスター）は空文字。
          stg_players.player_name と同じ作り方。
      - name: team_id
        description: >
          選手の所属チーム。元データで空の行がある（opponent_team_id も同じ）。
          補ったものは int_player_game_stats を使う。
      - name: team_city
        description: >
          {{ doc("team_city") }}
          一部のオールスターの行は null。
      - name: team_name
        description: >
          {{ doc("team_name") }}
          一部のプレシーズンの行は null。int_player_game_stats で team_id を補うときの照合に使う。
      - name: opponent_team_id
        description: 対戦相手のチームの team_id。team_id と同じく、元データで空の行がある。
      - name: opponent_team_city
        description: '{{ doc("opponent_team_city") }}'
      - name: opponent_team_name
        description: '{{ doc("opponent_team_name") }}'
      - name: is_home
        description: >
          {{ doc("is_home") }}
          一部のプレシーズンの行（team_name が null の行）は null。
      - name: is_win
        description: >
          {{ doc("is_win") }}
          一部のプレシーズンの行（team_name が null の行）と、ごく一部のレギュラーシーズンの行は null。
      - name: starting_position
        description: 先発したときのポジション（G・F・C）。ベンチから出場した場合と、出場しなかった場合は null。
      - name: is_starter
        description: 先発したか。false にはベンチから出場した場合と、出場しなかった場合の両方を含む。
      - name: status_comment
        description: "出場しなかった理由（例: DNP - Coach's Decision）。出場しなかった行でも null のことがある。"
      - name: minutes
        description: >
          出場時間（分）。元データの一部（プレシーズン）にある '6:05' のような分:秒の値は分に換算する。
          負の値は誤りとみなして null にする。出場しなかった行の多くは null。
      - name: points
        description: 得点。一部のプレシーズンの行は null。
      - name: field_goals_made
        description: '{{ doc("field_goals_made") }}'
      - name: field_goals_attempted
        description: '{{ doc("field_goals_attempted") }}'
      - name: three_pointers_made
        description: '{{ doc("three_pointers_made") }}'
      - name: three_pointers_attempted
        description: '{{ doc("three_pointers_attempted") }}'
      - name: free_throws_made
        description: '{{ doc("free_throws_made") }}'
      - name: free_throws_attempted
        description: '{{ doc("free_throws_attempted") }}'
      - name: offensive_rebounds
        description: '{{ doc("offensive_rebounds") }}'
      - name: defensive_rebounds
        description: '{{ doc("defensive_rebounds") }}'
      - name: total_rebounds
        description: '{{ doc("total_rebounds") }}'
      - name: assists
        description: '{{ doc("assists") }}'
      - name: steals
        description: '{{ doc("steals") }}'
      - name: blocks
        description: '{{ doc("blocks") }}'
      - name: turnovers
        description: '{{ doc("turnovers") }}'
      - name: personal_fouls
        description: '{{ doc("personal_fouls") }}'
      - name: plus_minus
        description: '{{ doc("plus_minus") }}'

  - name: stg_shots
    description: >
      シュートの記録。粒度: 1 シュート 1 行（game_id × action_number）。
      Play-by-Play のうちフィールドゴールの試投で、フリースローは含まない。
      {{ doc("start_season_year_filter") }}
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, action_number]
    columns:
      - name: game_id
        description: >
          {{ doc("game_id") }}
          {{ doc("game_id_not_in_games") }}
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_games')
                field: game_id
              # 元データの欠けで stg_games にない試合があるため、失敗ではなく警告にする
              config:
                severity: warn
      - name: action_number
        description: 試合の中でのプレーの通し番号。
        data_tests:
          - not_null
      - name: season_start_year
        description: '{{ doc("season_start_year") }}'
      - name: season
        description: '{{ doc("season") }}'
        data_tests:
          - not_null
      - name: game_type
        description: '{{ doc("game_type") }}'
        data_tests: *game_type_tests
      - name: game_date
        description: >
          {{ doc("game_date") }}
          stg_games と結合できない試合は null。
      - name: period
        description: ピリオド。1〜4 が通常のクォーターで、5 以降は延長。
        data_tests:
          - not_null
      - name: clock
        description: "ピリオドの残り時間。ISO 8601 の期間の形式（例: PT11M56.00S は残り 11 分 56 秒）。"
      - name: team_id
        description: シュートしたチーム。
        data_tests:
          - not_null
      - name: team_abbreviation
        description: "チームの略称（例: BOS）。2025-26 シーズンの一部の試合は null。"
      - name: player_id
        description: '{{ doc("player_id") }}'
      - name: player_name
        description: >
          シュートした選手の名前。null の行がある（大半は 2025-26 シーズンの一部の試合）ため、
          名前が必要なときは player_id で stg_players と結合する。
      - name: shot_type
        description: "シュートの種類（例: Jump Shot、Layup Shot）。"
      - name: is_made
        description: 決まったか。
        data_tests:
          - not_null
      - name: shot_value
        description: >
          2 点か 3 点か。2019-20 シーズンの途中で元データの記録の形式が変わったため、
          新しい形式では actionType（'2pt'・'3pt'）から求める。元データの誤った値（0）は null にする。
        data_tests:
          - accepted_values:
              arguments:
                values: [2, 3]
                quote: false
      - name: shot_distance_ft
        description: リングからの距離（フィート）。コートの長さ（94 フィート）を超える誤った値は null にする。
      - name: area_detail
        description: "リングからの距離の帯（フィート）と方向（例: 16-24 Left）。area と同じく 2021-22 シーズンまでは null。"
      - name: description
        description: "プレーの説明文（例: MISS V. Wembanyama driving Layup）。"
      - name: area
        description: "シュートしたエリア（例: Restricted Area、Left Corner 3）。2021-22 シーズンまでは null。"
      - name: x
        description: コート上の横方向の位置。2019-20 シーズンより前は null。2019-20 も一部の試合は null。
      - name: y
        description: コート上の縦方向の位置。2019-20 シーズンより前は null。2019-20 も一部の試合は null。
