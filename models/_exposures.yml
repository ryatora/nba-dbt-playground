# charts/ の dbt Charts のボードを、モデルの下流の使われ方として登録する。ボード 1 本につき 1 つ。
# name はボードのファイル名、label はグラフのタイトル（KPI のボードはグラフのラベル）、description はボードのパスとサブタイトル。
# ボードを足したとき、クエリの ref() やグラフのタイトル・サブタイトルを変えたときは、ここも直す。
# データを読まないボード（charts/callout/shot_coordinates_note.yml）は、依存するモデルがないため登録しない。
exposures:
  - name: points_mix_trend
    label: "1試合平均得点の内訳の推移"
    type: dashboard
    description: "dbt Charts のボード（charts/area/points_mix_trend.yml）。レギュラーシーズン。1チームあたり。横軸はシーズンの開始年。"
    depends_on:
      - ref('stg_team_game_stats')
    owner:
      name: nba-dbt-playground

  - name: shot_distance_streamgraph
    label: "シュートの距離別の本数の推移"
    type: dashboard
    description: "dbt Charts のボード（charts/area/shot_distance_streamgraph.yml）。レギュラーシーズン。1試合（両チーム合計）あたり。横軸はシーズンの開始年。"
    depends_on:
      - ref('stg_shots')
    owner:
      name: nba-dbt-playground

  - name: field_goal_attempt_mix_by_season
    label: "FG試投に占める2Pと3Pの割合"
    type: dashboard
    description: "dbt Charts のボード（charts/bar/field_goal_attempt_mix_by_season.yml）。レギュラーシーズン。"
    depends_on:
      - ref('stg_team_game_stats')
    owner:
      name: nba-dbt-playground

  - name: points_by_home_away
    label: "ホームとアウェイの1試合平均得点"
    type: dashboard
    description: "dbt Charts のボード（charts/bar/points_by_home_away.yml）。直近10シーズンのレギュラーシーズン。"
    depends_on:
      - ref('stg_team_game_stats')
    owner:
      name: nba-dbt-playground

  - name: points_per_shot_by_area
    label: "エリア別のシュート1本あたりの得点"
    type: dashboard
