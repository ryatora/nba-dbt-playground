models:
  - name: team_games
    description: >
      チームの試合ごとのボックススコア。粒度: 1 試合 × 1 チームにつき 1 行（game_id × team_id）。
      dbt Charts のグラフなど、利用者が読むためのモデル。列と行は stg_team_game_stats と同じで、列の説明は stg_team_game_stats を参照。
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, team_id]
    semantic_model:
      enabled: true
    # 1 行を表す列がない（game_id × team_id）ため、primary entity の名前を付ける
    # game・team は、それぞれ試合とチームの 1 行を指す列なので foreign entity にする
    primary_entity: team_game
    agg_time_dimension: game_date
    columns:
      - name: game_id
        description: '{{ doc("game_id") }}'
        data_tests:
          - not_null
        entity:
          type: foreign
          name: game
      - name: team_id
        description: '{{ doc("team_id") }}'
        data_tests:
          - not_null
        entity:
          type: foreign
          name: team
      - name: game_date
        description: '{{ doc("game_date") }}'
        granularity: day
        dimension:
          type: time
      - name: season
        description: '{{ doc("season") }}'
        dimension:
          type: categorical
      - name: game_type
        description: '{{ doc("game_type") }}'
        dimension:
          type: categorical
      - name: is_home
        description: '{{ doc("is_home") }}'
        dimension:
          type: categorical
      - name: team_name
        description: '{{ doc("team_name") }}'
        dimension:
          type: categorical
    metrics:
      - name: points
        description: 得点の合計。
        type: simple
        label: 得点
        agg: sum
      - name: team_game_count
        description: >
          試合数（1 試合 × 1 チームの行数）。2025-26 シーズンの一部の試合にある余分な行（team_name が null、得点が 0）も数えるため、
          その行を除いて求めた値とはわずかに異なる。
        type: simple
        label: 試合数
        agg: count
        expr: game_id
      - name: wins
        description: 勝利数。
        type: simple
        label: 勝利数
        agg: sum
        expr: CASE WHEN is_win THEN 1 ELSE 0 END
      - name: field_goals_attempted
        description: フィールドゴールの試投数の合計。
        type: simple
        label: FG 試投数
        agg: sum
      - name: three_pointers_attempted
        description: 3P の試投数の合計。
        type: simple
        label: 3P 試投数
        agg: sum
      - name: points_per_game
        description: 1 試合平均得点（得点 ÷ 試合数）。試合数に余分な行を含むため、team_name が null の行を除いて求めた値よりわずかに低い。
        type: ratio
        label: 1 試合平均得点
        numerator: points
        denominator: team_game_count
      - name: win_pct
        description: 勝率（勝利数 ÷ 試合数）。試合数に余分な行を含むため、team_name が null の行を除いて求めた値よりわずかに低い。
        type: ratio
        label: 勝率
        numerator: wins
        denominator: team_game_count
      - name: three_point_attempt_rate
        description: FG 試投に占める 3P の割合（3P 試投数 ÷ FG 試投数）。
        type: ratio
        label: 3P 試投率
        numerator: three_pointers_attempted
        denominator: field_goals_attempted

  - name: player_games
    description: >
      選手の試合ごとのボックススコア。粒度: 1 試合 × 1 選手につき 1 行（game_id × player_id）。
      dbt Charts のグラフなど、利用者が読むためのモデル。列と行は int_player_game_stats と同じ。
      team_id・opponent_team_id は元データで空の行を補ったもので、ほかの列の説明は stg_player_game_stats を参照。
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, player_id]
    columns:
      - name: game_id
        description: '{{ doc("game_id") }}'
        data_tests:
          - not_null
      - name: player_id
        description: '{{ doc("player_id") }}'
        data_tests:
          - not_null
      - name: team_id
        description: >
          選手の所属チーム。元データで空の行は、同じ試合のチームのボックススコアから補っている（int_player_game_stats）。
          チーム名が空の一部のプレシーズンの行と、一部のオールスターの行は補えず null。
      - name: opponent_team_id
        description: 対戦相手のチーム。team_id と同じ方法で補っている。

  - name: shots
    description: >
      シュートの記録。粒度: 1 シュート 1 行（game_id × action_number）。
      dbt Charts のグラフなど、利用者が読むためのモデル。列と行は stg_shots と同じで、列の説明は stg_shots を参照。
    data_tests:
      - unique_combination:
          arguments:
            columns: [game_id, action_number]
    columns:
      - name: game_id
        description: '{{ doc("game_id") }}'
        data_tests:
          - not_null
      - name: action_number
        description: 試合の中でのプレーの通し番号。
        data_tests:
          - not_null

  - name: games
    description: >
      試合の一覧。粒度: 1 試合 1 行（game_id）。
      dbt Charts のグラフなど、利用者が読むためのモデル。列と行は stg_games と同じで、列の説明は stg_games を参照。
    columns:
      - name: game_id
        description: '{{ doc("game_id") }}'
        data_tests:
          - unique
          - not_null
