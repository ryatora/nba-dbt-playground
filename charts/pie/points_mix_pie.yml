queries:
  points_mix:
    sql: |
      WITH games AS (
          SELECT
              field_goals_made,
              three_pointers_made,
              free_throws_made
          FROM {{ ref('stg_team_game_stats') }}
          WHERE
              season_start_year = 2025
              AND game_type = 'Regular Season'
              AND team_name IS NOT NULL
      )

      SELECT
          '2P' AS shot_type,
          SUM(2 * (field_goals_made - three_pointers_made)) AS points
      FROM games
      UNION ALL
      SELECT
          '3P' AS shot_type,
          SUM(3 * three_pointers_made) AS points
      FROM games
      UNION ALL
      SELECT
          'FT' AS shot_type,
          SUM(free_throws_made) AS points
      FROM games

charts:
  points_mix:
    query: points_mix
    type: pie
    title: 得点の内訳
    subtitle: 2025-26 レギュラーシーズン。リーグ全体
    theta: points
    color: shot_type

rows:
  - points_mix
