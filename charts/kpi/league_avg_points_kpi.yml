width: 640

queries:
  league_avg_points:
    sql: |
      WITH seasons AS (
          SELECT
              season_start_year,
              AVG(points) AS avg_points
          FROM {{ ref('stg_team_game_stats') }}
          WHERE
              season_start_year IN (2024, 2025)
              AND game_type = 'Regular Season'
              AND team_name IS NOT NULL
          GROUP BY season_start_year
      )

      -- KPI のクエリは1行にする
      SELECT
          MAX(CASE WHEN season_start_year = 2025 THEN avg_points END) AS avg_points,
          MAX(CASE WHEN season_start_year = 2025 THEN avg_points END)
          - MAX(CASE WHEN season_start_year = 2024 THEN avg_points END) AS avg_points_change
      FROM seasons

charts:
  league_avg_points:
    query: league_avg_points
    type: kpi
    label: 1試合平均得点（2025-26 レギュラーシーズン）
    value: avg_points
    style:
      value:
        format: ",.1f"
    support:
      value: avg_points_change
      label: 前シーズンとの差
      format: "+.1f"

rows:
  - league_avg_points
