# 5つのパネルの横軸の目盛りが重ならない幅
width: 1200

queries:
  atlantic_three_point_trend:
    sql: |
      SELECT
          season_start_year,
          team_name AS team,
          AVG(three_pointers_attempted) AS avg_three_pointers_attempted
      FROM {{ ref('team_games') }}
      WHERE
          game_type = 'Regular Season'
          -- アトランティック・ディビジョンの5チーム
          AND team_name IN ('76ers', 'Celtics', 'Knicks', 'Nets', 'Raptors')
      GROUP BY season_start_year, team_name
      ORDER BY team_name, season_start_year

charts:
  three_point_trend:
    query: atlantic_three_point_trend
    type: line
    title: 1試合平均3P試投数の推移
    subtitle: アトランティック・ディビジョンの5チーム。レギュラーシーズン。横軸はシーズンの開始年
    x: season_start_year
    y: avg_three_pointers_attempted
    multiples:
      columns: team

rows:
  - three_point_trend
