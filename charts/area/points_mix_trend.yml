queries:
  points_mix_trend:
    sql: |
      WITH seasons AS (
          SELECT
              season_start_year,
              AVG(2 * (field_goals_made - three_pointers_made)) AS two_point_points,
              AVG(3 * three_pointers_made) AS three_point_points,
              AVG(free_throws_made) AS free_throw_points
          FROM {{ ref('stg_team_game_stats') }}
          WHERE
              game_type = 'Regular Season'
              AND team_name IS NOT NULL
          GROUP BY season_start_year
      )

      SELECT
          season_start_year,
          '3P' AS shot_type,
          three_point_points AS points,
          1 AS shot_type_order
      FROM seasons
      UNION ALL
      SELECT
          season_start_year,
          '2P' AS shot_type,
          two_point_points AS points,
          2 AS shot_type_order
      FROM seasons
      UNION ALL
      SELECT
          season_start_year,
          'FT' AS shot_type,
          free_throw_points AS points,
          3 AS shot_type_order
      FROM seasons
      ORDER BY shot_type_order, season_start_year

charts:
  points_mix:
    query: points_mix_trend
    type: area
    title: 1試合平均得点の内訳の推移
    subtitle: レギュラーシーズン。1チームあたり。横軸はシーズンの開始年
    x: season_start_year
    y: points
    color: shot_type
    style:
      stack: zero
      stack_order: data

rows:
  - points_mix
