width: 640

queries:
  three_point_pct_by_team:
    sql: |
      SELECT
          team_city || ' ' || team_name AS team,
          -- スパークバーの値には書式を指定できないので、% の数値にしておく
          ROUND(SUM(three_pointers_made) / SUM(three_pointers_attempted) * 100, 1) AS three_point_pct
      FROM {{ ref('stg_team_game_stats') }}
      WHERE
          season_start_year = 2025
          AND game_type = 'Regular Season'
          AND team_name IS NOT NULL
      GROUP BY team
      ORDER BY three_point_pct DESC
      LIMIT 10

charts:
  three_point_pct:
    query: three_point_pct_by_team
    type: spark_bar
    title: 3P成功率の上位10チーム
    subtitle: 2025-26 レギュラーシーズン。値は%
    x: three_point_pct
    y: team
    style:
      label:
        width: 200

rows:
  - three_point_pct
