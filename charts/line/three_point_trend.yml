queries:
  three_point_trend:
    sql: |
      SELECT
          season_start_year,
          AVG(three_pointers_attempted) AS avg_three_pointers_attempted
      FROM {{ ref('team_games') }}
      WHERE
          game_type = 'Regular Season'
          AND team_name IS NOT NULL
      GROUP BY season_start_year
      ORDER BY season_start_year

charts:
  three_point_trend:
    query: three_point_trend
    type: line
    title: 1試合平均3P試投数の推移
    subtitle: レギュラーシーズン。1チームあたり。横軸はシーズンの開始年
    x: season_start_year
    y: avg_three_pointers_attempted

rows:
  - three_point_trend
