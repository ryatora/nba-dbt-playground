name: nba_playground
version: "1.0.0"
profile: nba_playground
# dbt v2（PyPI の dbt パッケージ）で動かす前提
require-dbt-version: [">=2.0.0", "<3.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]

vars:
  # staging で残すシーズンの開始年。全テーブル共通
  start_season_year: 2000

models:
  nba_playground:
    # group は models/_groups.yml で定義している
    +group: nba
    # staging と intermediate は private にし、同じ group のモデルからだけ参照できるようにする
    # exposures は group に属さないため、private のモデルを参照できない
    # dbt Charts のグラフは exposures に登録しているので、marts を読む
    staging:
      +access: private
      +materialized: view
      +schema: staging
    intermediate:
      +access: private
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: view
      +schema: marts

seeds:
  nba_playground:
    +group: nba
    +schema: seeds
